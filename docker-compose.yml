services:
    server:
        build: ./server
        environment:
            - TZ=America/Bahia
        ports:
            - "50051:50051"
        volumes:
            - ./server:/app
        restart: always
    client:
        build: ./client
        volumes:
            - ./client:/app
        stdin_open: true
        tty: true
        depends_on:
            - server
        environment:
            - GRPC_ADDRESS=server:50051
            - TZ=America/Bahia
    client2:
        build: ./client
        volumes:
            - ./client:/app
        stdin_open: true
        tty: true
        depends_on:
            - server
        environment:
            - GRPC_ADDRESS=server:50051
            - TZ=America/Bahia