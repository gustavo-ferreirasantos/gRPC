version: '3.8'
services:
    server:
        build: .server
        ports:
            - "8080:8080"
        volumes:
            - .server:/app
        restart: always
        depends_on:
            - db
    client:
        build: .client
        ports:
            - "8081:8080"
        volumes:
            - .client:/app
        restart: always
        depends_on:
            - server
            - db
    client2:
        build: .client
        ports:
            - "8082:8080"
        volumes:
            - .client:/app
        restart: always
        depends_on:
            - server
            - db
    
    db:
        image: mysql:5.7
        environment:
            - Password=root
        ports:
            - "3306:3306"